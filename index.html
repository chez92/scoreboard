<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>chez의 점수판</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #111;
            color: #fff;
            font-family: 'Consolas', 'Courier New', monospace, sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           타이머
           ========================= */

        .timer-board {
            position: relative;
            text-align: center;
            padding: clamp(3px, 0.8vh, 10px) 15px;
            background: #181818;
            border-bottom: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mode-switch {
            position: absolute;
            top: clamp(4px, 0.8vh, 8px);
            left: 16px;
            right: 16px;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: clamp(1rem, 2.8vw, 1.5rem);
            font-weight: bold;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 10;
            white-space: nowrap;
        }

        .mode-switch span {
            cursor: pointer;
            padding: 2px 5px;
            color: #888;
        }

        .mode-switch span.active {
            color: #fff;
        }

        .mode-switch span:active {
            transform: scale(0.95);
        }

        .timer-ctrl-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
        }

        .time-display-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .time-display {
            font-size: clamp(4rem, 20.4vw, 14.45rem);
            font-weight: bold;
            color: #ffffff;
            font-family: 'Consolas', 'Courier New', monospace;
            letter-spacing: 4px;
            line-height: 0.85;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .timer-btn-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            width: 96vw;
            max-width: 620px;
            gap: 5px;
            margin-top: clamp(2px, 0.5vh, 8px);
        }

        .timer-btn {
            width: 100%;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: bold;
            font-family: system-ui, -apple-system, sans-serif;
            padding: clamp(4px, 0.8vh, 8px) clamp(15px, 3vw, 28px);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .time-minus,
        .time-plus {
            background: #333;
            border: 2px solid #666;
            color: #fff;
        }

        .btn-start {
            background: #18a83a;
            color: white;
        }

        .btn-reset {
            background: #f08a24;
            color: white;
        }

        .timer-btn:active {
            transform: scale(0.95);
        }

        /* =========================
           스코어보드
           ========================= */

        .scoreboard {
            display: flex;
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .team-a {
            background: #111;
            border-right: 2px solid #555;
        }

        .team-b {
            background: #eeeeee;
            border-left: 2px solid #555;
            color: #111;
        }

        /* =========================
           팀 이름
           ========================= */

        .team-title {
            flex: 0 0 auto;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.2rem, 4vw, 3rem);
            font-weight: bold;
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 2px;
            opacity: 0.95;
            z-index: 2;
        }

        /* =========================
           점수
           ========================= */

        .score {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(8rem, 65vh, 48rem);
            font-weight: bold;
            font-family: 'Consolas', 'Courier New', monospace;
            line-height: 0.8;
            margin: 0;
            padding: 0;
            z-index: 1;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            overflow: hidden;
            white-space: nowrap;
        }

        .team-a .score {
            color: #ffffff;
        }

        .team-b .score {
            color: #111111;
            text-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        .score.two-digit {
            font-size: min(40vw, 38vh);
            letter-spacing: -4px;
        }

        .score.three-digit {
            font-size: min(27vw, 30vh);
            letter-spacing: -5px;
        }

        .score.four-digit {
            font-size: min(20vw, 24vh);
            letter-spacing: -6px;
        }

        /* =========================
           점수 조절 버튼
           ========================= */

        .score-ctrls {
            flex: 0 0 auto;
            width: 82%;
            height: 56px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 9px;
            z-index: 5;
        }

        .score-btn {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 7px;
            font-size: clamp(1.4rem, 6vw, 2.5rem);
            font-weight: bold;
            font-family: 'Consolas', 'Courier New', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            padding: 0;
            margin: 0;
        }

        .team-a .btn-plus,
        .team-a .btn-minus {
            background: #333;
            color: #fff;
        }

        .team-a .btn-minus {
            background: #1c1c1c;
        }

        .team-a .score-reset-btn {
            background: #333;
            color: #fff;
        }

        .team-b .btn-plus,
        .team-b .btn-minus {
            background: #cccccc;
            color: #111;
        }

        .team-b .btn-minus {
            background: #aaaaaa;
        }

        .team-b .score-reset-btn {
            background: #cccccc;
            color: #111;
        }

        .score-btn:active,
        .score-reset-btn:active {
            filter: brightness(1.4);
            transform: scale(0.95);
        }

        /* =========================
           모바일 세로모드
           ========================= */

        @media (max-width: 600px) and (orientation: portrait) {

            .timer-board {
                min-height: 205px;
                padding: 8px 10px 10px;
            }

            .mode-switch {
                top: 7px;
                left: 12px;
                right: 12px;
            }

            .timer-ctrl-wrapper {
                padding-top: 24px;
            }

            .time-display {
                font-size: min(34vw, 13rem);
                line-height: 0.82;
                letter-spacing: 2px;
            }

            .timer-btn-group {
                width: 94vw;
                gap: 5px;
                margin-top: 8px;
            }

            .timer-btn {
                font-size: clamp(0.9rem, 4vw, 1.2rem);
                padding: 7px 8px;
                border-radius: 7px;
            }

            .team-title {
                height: 38px;
                font-size: clamp(1rem, 4vw, 1.4rem);
            }

            .score {
                font-size: min(65vh, 70vw);
            }

            .score.two-digit {
                font-size: min(40vw, 34vh);
                letter-spacing: -4px;
            }

            .score.three-digit {
                font-size: min(27vw, 28vh);
                letter-spacing: -5px;
            }

            .score.four-digit {
                font-size: min(20vw, 22vh);
                letter-spacing: -6px;
            }

            .score-ctrls {
                width: 82%;
                height: 50px;
                margin-bottom: 8px;
                gap: 4px;
            }

            .score-btn {
                font-size: clamp(1.3rem, 6vw, 2rem);
            }
        }

        /* =========================
           모바일 가로모드
           ========================= */

        @media (orientation: landscape) and (max-height: 500px) {

            .timer-board {
                min-height: 135px;
                height: 135px;
                padding: 2px 8px 5px;
                justify-content: flex-start;
            }

            .mode-switch {
                top: 0;
                left: 10px;
                right: 10px;
                font-size: min(3vw, 1.1rem);
                z-index: 10;
            }

            .mode-switch span {
                padding: 0 4px;
            }

            .timer-ctrl-wrapper {
                height: 88px;
                padding-top: 12px;
                justify-content: center;
                overflow: visible;
            }

            .time-display-row {
                height: 58px;
                overflow: visible;
            }

            .time-display {
                font-size: min(18vw, 15vh);
                line-height: 0.75;
                letter-spacing: 1px;
                position: relative;
                z-index: 1;
            }

            .timer-btn-group {
                width: min(82vw, 430px);
                gap: 5px;
                margin-top: 0;
                z-index: 5;
            }

            .timer-btn {
                font-size: min(2.3vw, 3vh);
                padding: 3px 10px;
                border-radius: 5px;
            }

            .team-title {
                height: 30px;
                font-size: min(4vw, 5vh);
            }

            .score {
                font-size: min(65vh, 28vw);
                line-height: 0.8;
            }

            .score.two-digit {
                font-size: min(50vw, 40vh);
                line-height: 0.8;
                letter-spacing: -3px;
            }

            .score.three-digit {
                font-size: min(13vw, 24vh);
                letter-spacing: -4px;
            }

            .score.four-digit {
                font-size: min(10vw, 20vh);
                letter-spacing: -4px;
            }

            .score-ctrls {
                width: min(42%, 220px);
                height: min(13vh, 48px);
                margin-bottom: 5px;
                gap: 4px;
            }

            .score-btn {
                font-size: min(5vw, 7vh);
            }
        }

        /* =========================
           매우 작은 가로 화면
           ========================= */

        @media (orientation: landscape) and (max-height: 380px) {

            .timer-board {
                min-height: 120px;
                height: 120px;
                padding: 1px 6px 3px;
            }

            .mode-switch {
                top: -2px;
                left: 8px;
                right: 8px;
                font-size: min(2.8vw, 1rem);
            }

            .timer-ctrl-wrapper {
                height: 78px;
                padding-top: 8px;
            }

            .time-display-row {
                height: 50px;
            }

            .time-display {
                font-size: min(17vw, 14vh);
                line-height: 0.7;
            }

            .timer-btn-group {
                width: min(84vw, 420px);
                gap: 4px;
                margin-top: 0;
            }

            .timer-btn {
                font-size: min(2.1vw, 2.8vh);
                padding: 2px 8px;
            }

            .team-title {
                height: 26px;
                font-size: min(3.5vw, 4vh);
            }

            .score {
                font-size: min(60vh, 25vw);
            }

            .score.two-digit {
                font-size: min(16vw, 27vh);
                letter-spacing: -3px;
            }

            .score.three-digit {
                font-size: min(11vw, 22vh);
                letter-spacing: -4px;
            }

            .score-ctrls {
                width: min(42%, 220px);
                height: min(13vh, 48px);
                margin-bottom: 5px;
                gap: 4px;
            }

            .score-btn {
                font-size: min(5vw, 1.8rem);
            }
        }
    </style>
</head>

<body>

    <div class="timer-board">

        <div class="mode-switch">
            <span
                id="futsalModeText"
                class="active"
                onclick="setGameMode(false)"
            >풋살</span>

            <span
                id="modeArrow"
                onclick="toggleGameMode()"
            >←</span>

            <span
                id="soccerModeText"
                onclick="setGameMode(true)"
            >축구</span>
        </div>

        <div class="timer-ctrl-wrapper">

            <div class="time-display-row">
                <div
                    class="time-display"
                    id="timeDisplay"
                >
                    06:00
                </div>
            </div>

        </div>

        <div class="timer-btn-group">

            <button
                class="timer-btn time-minus"
                id="minusTimeBtn"
                onclick="adjustTime(isSoccerMode ? -300 : -60)"
            >-1m</button>

            <button
                class="timer-btn btn-start"
                id="startBtn"
                onclick="toggleTimer()"
            >시작</button>

            <button
                class="timer-btn btn-reset"
                onclick="resetTimer()"
            >리셋</button>

            <button
                class="timer-btn time-plus"
                id="plusTimeBtn"
                onclick="adjustTime(isSoccerMode ? 300 : 60)"
            >+1m</button>

        </div>

    </div>

    <div class="scoreboard">

        <div class="team team-a">

            <div class="team-title">
                HOME
            </div>

            <div
                class="score"
                id="scoreA"
            >
                0
            </div>

            <div class="score-ctrls">

                <button
                    class="score-btn btn-minus"
                    onclick="changeScore('A', -1)"
                >
                    -
                </button>

                <button
                    class="score-btn score-reset-btn"
                    onclick="resetScore('A')"
                >
                    0
                </button>

                <button
                    class="score-btn btn-plus"
                    onclick="changeScore('A', 1)"
                >
                    +
                </button>

            </div>

        </div>

        <div class="team team-b">

            <div class="team-title">
                AWAY
            </div>

            <div
                class="score"
                id="scoreB"
            >
                0
            </div>

            <div class="score-ctrls">

                <button
                    class="score-btn btn-minus"
                    onclick="changeScore('B', -1)"
                >
                    -
                </button>

                <button
                    class="score-btn score-reset-btn"
                    onclick="resetScore('B')"
                >
                    0
                </button>

                <button
                    class="score-btn btn-plus"
                    onclick="changeScore('B', 1)"
                >
                    +
                </button>

            </div>

        </div>

    </div>

    <audio
        id="sound10s"
        preload="auto"
        src="./10s.mp3"
    ></audio>

    <audio
        id="soundEnd"
        preload="auto"
        src="./end.mp3"
    ></audio>

    <script>

        let scoreA = 0;
        let scoreB = 0;

        let totalSeconds = 360;
        let initialSeconds = 360;

        let timerInterval = null;
        let isRunning = false;
        let isSoccerMode = false;

        const sound10s = document.getElementById("sound10s");
        const soundEnd = document.getElementById("soundEnd");

        const audioCtx =
            new (window.AudioContext || window.webkitAudioContext)();

        function updateScoreSize(element, score) {

            element.classList.remove(
                'two-digit',
                'three-digit',
                'four-digit'
            );

            const digits = String(score).length;

            if (digits === 2) {
                element.classList.add('two-digit');
            }
            else if (digits === 3) {
                element.classList.add('three-digit');
            }
            else if (digits >= 4) {
                element.classList.add('four-digit');
            }
        }

        function updateAllScoreSizes() {

            updateScoreSize(
                document.getElementById('scoreA'),
                scoreA
            );

            updateScoreSize(
                document.getElementById('scoreB'),
                scoreB
            );
        }

        function playClapSound() {

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            const strikes = [
                0,
                0.12,
                0.24,
                0.36,
                0.48,
                0.72,
                0.96,
                1.20,
                1.44
            ];

            strikes.forEach((delay) => {

                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();

                const filter =
                    audioCtx.createBiquadFilter();

                osc.type = 'triangle';

                osc.frequency.setValueAtTime(
                    1100,
                    now + delay
                );

                osc.frequency.exponentialRampToValueAtTime(
                    180,
                    now + delay + 0.055
                );

                filter.type = 'highpass';

                filter.frequency.setValueAtTime(
                    350,
                    now + delay
                );

                gain.gain.setValueAtTime(
                    0.95,
                    now + delay
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    now + delay + 0.07
                );

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + delay);

                osc.stop(
                    now + delay + 0.08
                );

            });

        }

        function playBuzzerSound() {

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            const osc1 =
                audioCtx.createOscillator();

            const osc2 =
                audioCtx.createOscillator();

            const gain =
                audioCtx.createGain();

            osc1.type = 'sawtooth';
            osc2.type = 'square';

            osc1.frequency.setValueAtTime(
                110,
                now
            );

            osc2.frequency.setValueAtTime(
                146.83,
                now
            );

            gain.gain.setValueAtTime(
                1.0,
                now
            );

            gain.gain.setValueAtTime(
                1.0,
                now + 5.5
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 6.0
            );

            osc1.connect(gain);
            osc2.connect(gain);

            gain.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);

            osc1.stop(now + 6.0);
            osc2.stop(now + 6.0);

        }

        function updateDisplay() {

            const min =
                String(
                    Math.floor(totalSeconds / 60)
                ).padStart(2, '0');

            const sec =
                String(
                    totalSeconds % 60
                ).padStart(2, '0');

            document.getElementById(
                'timeDisplay'
            ).innerText =
                `${min}:${sec}`;

        }

        function adjustTime(seconds) {

            if (isRunning) {
                return;
            }

            totalSeconds =
                Math.max(
                    0,
                    totalSeconds + seconds
                );

            initialSeconds =
                totalSeconds;

            updateDisplay();

        }

        function toggleGameMode() {
            setGameMode(!isSoccerMode);
        }

        function setGameMode(soccer) {

            if (isRunning) {
                return;
            }

            isSoccerMode = soccer;

            document.getElementById(
                'futsalModeText'
            ).classList.toggle(
                'active',
                !soccer
            );

            document.getElementById(
                'soccerModeText'
            ).classList.toggle(
                'active',
                soccer
            );

            document.getElementById(
                'modeArrow'
            ).innerText =
                soccer ? '→' : '←';

            if (isSoccerMode) {

                totalSeconds =
                    25 * 60;

                initialSeconds =
                    totalSeconds;

                document.getElementById(
                    'minusTimeBtn'
                ).innerText =
                    '-5m';

                document.getElementById(
                    'plusTimeBtn'
                ).innerText =
                    '+5m';

            } else {

                totalSeconds =
                    6 * 60;

                initialSeconds =
                    totalSeconds;

                document.getElementById(
                    'minusTimeBtn'
                ).innerText =
                    '-1m';

                document.getElementById(
                    'plusTimeBtn'
                ).innerText =
                    '+1m';

            }

            updateDisplay();

        }

        function toggleTimer() {

            if (isRunning) {

                clearInterval(timerInterval);

                timerInterval = null;

                isRunning = false;

                document.getElementById(
                    'startBtn'
                ).innerText =
                    '시작';

                return;
            }

            if (totalSeconds <= 0) {
                return;
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isRunning = true;

            document.getElementById(
                'startBtn'
            ).innerText =
                '일시정지';

            timerInterval =
                setInterval(() => {

                    if (totalSeconds > 0) {

                        totalSeconds--;

                        updateDisplay();

                        const warningTime =
                            isSoccerMode ? 60 : 10;

                        if (
                            totalSeconds === warningTime
                        ) {

                            sound10s.currentTime = 0;

                            sound10s
                                .play()
                                .catch(
                                    () => playClapSound()
                                );

                        }

                        if (totalSeconds === 0) {

                            clearInterval(
                                timerInterval
                            );

                            timerInterval = null;

                            isRunning = false;

                            document.getElementById(
                                'startBtn'
                            ).innerText =
                                '시작';

                            soundEnd.currentTime = 0;

                            soundEnd
                                .play()
                                .catch(
                                    () => playBuzzerSound()
                                );

                        }

                    }

                }, 1000);

        }

        function resetTimer() {

            clearInterval(timerInterval);

            timerInterval = null;

            isRunning = false;

            totalSeconds =
                initialSeconds;

            sound10s.pause();
            sound10s.currentTime = 0;

            soundEnd.pause();
            soundEnd.currentTime = 0;

            document.getElementById(
                'startBtn'
            ).innerText =
                '시작';

            updateDisplay();

        }

        function changeScore(team, val) {

            if (team === 'A') {

                scoreA =
                    Math.max(
                        0,
                        scoreA + val
                    );

                document.getElementById(
                    'scoreA'
                ).innerText =
                    scoreA;

                updateScoreSize(
                    document.getElementById('scoreA'),
                    scoreA
                );

            } else {

                scoreB =
                    Math.max(
                        0,
                        scoreB + val
                    );

                document.getElementById(
                    'scoreB'
                ).innerText =
                    scoreB;

                updateScoreSize(
                    document.getElementById('scoreB'),
                    scoreB
                );

            }

        }

        function resetScore(team) {

            if (team === 'A') {

                scoreA = 0;

                document.getElementById(
                    'scoreA'
                ).innerText =
                    '0';

                updateScoreSize(
                    document.getElementById('scoreA'),
                    0
                );

            } else {

                scoreB = 0;

                document.getElementById(
                    'scoreB'
                ).innerText =
                    '0';

                updateScoreSize(
                    document.getElementById('scoreB'),
                    0
                );

            }

        }

        window.addEventListener("load", () => {

            updateDisplay();

            updateAllScoreSizes();

        });

    </script>

</body>

</html>
